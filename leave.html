<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ระบบควบคุมการลา – สภ.บางบ่อ</title>
<link rel="icon" type="image/png" href="https://amarax23.github.io/kuamkumla-bangbo/logo.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<style>
  html,body{margin:0;height:100%;background:#f1f5f9}
  iframe{display:block;border:0;width:100%;height:100vh;height:100dvh}
</style>
</head>
<body>
<!-- เปิดระบบลาภายในแอป "สภ.บางบ่อ" (อยู่ใต้ /BangboCar/ จึงไม่เด้งเป็นหน้าต่างเบราว์เซอร์บน iPhone) -->
<iframe id="f" title="ระบบควบคุมการลา" src="https://amarax23.github.io/kuamkumla-bangbo/" allow="clipboard-write"></iframe>
<script>
  // ส่งต่อ #แท็บ/พารามิเตอร์ (ถ้ามี) และให้ชื่อหน้าตามหน้าระบบลา
  const f = document.getElementById('f');
  if (location.search || location.hash) f.src = 'https://amarax23.github.io/kuamkumla-bangbo/' + location.search + location.hash;
  f.addEventListener('load', () => { try { document.title = f.contentDocument.title || document.title; } catch(_){} });
</script>
</body>
</html>
